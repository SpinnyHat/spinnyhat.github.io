<title>spinny — profile</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  /* Committed to one dark world on purpose — an arcade screen doesn't
     switch to "light mode", and bright accents need a dark ground to
     actually read against. */
  :root {
    --paper: #0a0b10;
    --ink: #eef1f7;
    --ink-soft: #8a90a6;
    --accent: #4deeea;
    --accent-2: #ff3d81;
    --btn-ink: #0a0b10;
    --shadow: var(--accent);
    --font-display: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Hiragino Sans",
      "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
    --font-body: var(--font-display);
    --font-mono: ui-monospace, "Cascadia Code", "SFMono-Regular", "Consolas",
      "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 7vh 1.25rem;
    position: relative;
    overflow-x: hidden;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .dots {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image: radial-gradient(circle, var(--ink) 1.4px, transparent 1.4px);
    background-size: 22px 22px;
    opacity: 0.08;
  }

  canvas#lanes {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 0;
    transition: z-index 0s;
  }

  body.playing canvas#lanes {
    z-index: 5;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 25rem;
    background: var(--paper);
    border: 4px solid var(--ink);
    padding: clamp(1.5rem, 5vw, 2.15rem);
    transform: rotate(-1.1deg);
    box-shadow: 9px 9px 0 var(--shadow);
    filter: none;
    transition: filter 0.25s ease;
  }

  body.playing .card {
    filter: blur(6px) brightness(0.45);
  }

  .key-hint {
    position: fixed;
    left: 50%;
    bottom: 1.4rem;
    transform: translateX(-50%);
    z-index: 1;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    opacity: 0.55;
    transition: opacity 0.25s ease;
    pointer-events: none;
    text-align: center;
  }

  body.playing .key-hint {
    opacity: 0;
  }

  .icon-btn {
    position: fixed;
    top: 1.1rem;
    left: 1.1rem;
    z-index: 6;
    width: 2.4rem;
    height: 2.4rem;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    border: 3px solid var(--ink);
    color: var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
    cursor: pointer;
    transition: transform 0.08s ease, box-shadow 0.08s ease, opacity 0.25s ease;
  }

  .icon-btn:hover {
    transform: translate(-1px, -1px);
    box-shadow: 5px 5px 0 var(--ink);
  }

  .icon-btn:active {
    transform: translate(3px, 3px);
    box-shadow: 0 0 0 var(--ink);
  }

  .icon-btn svg { width: 1.2rem; height: 1.2rem; fill: none; stroke: currentColor; stroke-width: 2; }

  body.playing .icon-btn {
    opacity: 0;
    pointer-events: none;
  }

  .settings-overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: rgba(5, 5, 8, 0.72);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.25rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
  }

  .settings-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .settings-panel {
    width: 100%;
    max-width: 22rem;
    background: var(--paper);
    border: 4px solid var(--ink);
    box-shadow: 8px 8px 0 var(--accent);
    padding: 1.5rem;
  }

  .settings-title {
    margin: 0 0 1rem;
    font-family: var(--font-mono);
    font-weight: 900;
    font-size: 1.1rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .key-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    padding: 0.55rem 0;
    border-bottom: 2px dashed var(--ink-soft);
  }

  .key-row:last-of-type { border-bottom: none; }

  .key-row-label {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .key-badge {
    font-family: var(--font-mono);
    font-weight: 900;
    font-size: 0.85rem;
    letter-spacing: 0.04em;
    background: var(--accent);
    color: var(--btn-ink);
    border: 3px solid var(--ink);
    padding: 0.35rem 0.9rem;
    cursor: pointer;
    min-width: 4.5rem;
    text-align: center;
  }

  .key-badge.listening {
    background: var(--accent-2);
    animation: badge-pulse 0.9s ease-in-out infinite;
  }

  @keyframes badge-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }

  .settings-actions {
    display: flex;
    gap: 0.6rem;
    margin-top: 1.3rem;
  }

  .settings-actions button {
    flex: 1;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0.55rem 0.5rem;
    border: 3px solid var(--ink);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
  }

  .settings-actions button.primary {
    background: var(--ink);
    color: var(--paper);
  }

  .lang-toggle {
    position: absolute;
    top: -1.1rem;
    right: 1.1rem;
    display: flex;
    border: 3px solid var(--ink);
    background: var(--paper);
    transform: rotate(2deg);
    font-family: var(--font-mono);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.04em;
  }

  .lang-toggle button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink);
    padding: 0.3rem 0.6rem;
    cursor: pointer;
  }

  .lang-toggle button + button {
    border-left: 3px solid var(--ink);
  }

  .lang-toggle button[aria-pressed="true"] {
    background: var(--ink);
    color: var(--paper);
  }

  .lang-toggle button:focus-visible,
  .link-note:focus-visible,
  .icon-btn:focus-visible,
  .key-badge:focus-visible,
  .settings-panel button:focus-visible {
    outline: 3px solid var(--accent-2);
    outline-offset: 2px;
  }

  .title-plate {
    margin: 0.5rem 0 1rem;
  }

  .eyebrow {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    background: var(--ink);
    color: var(--paper);
    padding: 0.18rem 0.5rem;
    margin-bottom: 0.6rem;
    transform: rotate(-1deg);
  }

  .handle {
    position: relative;
    margin: 0;
    font-weight: 900;
    text-transform: uppercase;
    font-size: clamp(2.1rem, 10vw, 3.1rem);
    line-height: 0.95;
    letter-spacing: -0.02em;
    text-wrap: balance;
    width: fit-content;
  }

  .handle::after {
    content: "";
    position: absolute;
    left: -0.14em;
    right: -0.08em;
    bottom: 0.04em;
    height: 0.4em;
    border: 3px solid var(--accent);
    z-index: -1;
    transform: rotate(-1deg);
  }

  .bio {
    margin: 1rem 0 1.3rem;
    padding: 0.6rem 0.75rem;
    border: 2px dashed var(--ink-soft);
    color: var(--ink);
    font-size: 0.95rem;
    line-height: 1.55;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
  }

  .link-note {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    width: 100%;
    padding: 0.75rem 0.9rem;
    background: var(--accent);
    border: 3px solid var(--ink);
    color: var(--btn-ink);
    text-decoration: none;
    font-family: var(--font-body);
    text-align: left;
    cursor: pointer;
    box-shadow: 5px 5px 0 var(--ink);
    transform: translate(0, 0);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }

  .link-note.alt { background: var(--accent-2); }

  .link-note:hover {
    transform: translate(-2px, -2px);
    box-shadow: 7px 7px 0 var(--ink);
  }

  .link-note:active {
    transform: translate(5px, 5px);
    box-shadow: 0 0 0 var(--ink);
  }

  .note-icon {
    flex: none;
    width: 1.2rem;
    height: 1.2rem;
    color: var(--btn-ink);
  }
  .note-icon svg { width: 100%; height: 100%; display: block; fill: currentColor; }

  .note-label {
    display: flex;
    flex-direction: column;
    gap: 0.05rem;
    min-width: 0;
  }

  .note-kind {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--btn-ink);
    opacity: 0.7;
  }

  .note-handle {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--btn-ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .copy-hint {
    margin-left: auto;
    flex: none;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 0.62rem;
    color: var(--btn-ink);
    border: 2px solid var(--btn-ink);
    padding: 0.1rem 0.32rem;
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .link-note:hover .copy-hint,
  .link-note:focus-visible .copy-hint {
    opacity: 0.8;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 2rem;
    transform: translate(-50%, 0.5rem);
    z-index: 20;
    background: var(--paper);
    border: 3px solid var(--accent);
    color: var(--ink);
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    padding: 0.55rem 1rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
</style>

<script>
  (function () {
    var dict = {
      ja: {
        eyebrow: "プレイヤー",
        bio: "ただの音ゲーマー",
        xLabel: "X (Twitter)",
        discordLabel: "Discord",
        noteLabel: "Note",
        youtubeLabel: "YouTube",
        copyHint: "コピー",
        settingsTitle: "設定",
        settingsReset: "リセット",
        settingsDone: "完了",
        toastCopied: "コピーしました",
        toastFailed: "コピーできませんでした"
      },
      en: {
        eyebrow: "PLAYER",
        bio: "Just a rhythm gamer",
        xLabel: "X (Twitter)",
        discordLabel: "Discord",
        noteLabel: "Note",
        youtubeLabel: "YouTube",
        copyHint: "COPY",
        settingsTitle: "SETTINGS",
        settingsReset: "RESET",
        settingsDone: "DONE",
        toastCopied: "Copied",
        toastFailed: "Couldn't copy"
      }
    };

    var buttons = document.querySelectorAll(".lang-toggle button");
    var toastEl = document.getElementById("toast");
    var toastTimer = null;

    function setLang(lang) {
      var d = dict[lang] || dict.ja;
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        var key = el.getAttribute("data-i18n");
        if (d[key] != null) el.textContent = d[key];
      });
      buttons.forEach(function (btn) {
        btn.setAttribute("aria-pressed", String(btn.dataset.lang === lang));
      });
      try {
        localStorage.setItem("spinny-lang", lang);
      } catch (e) {}
      document.dispatchEvent(new CustomEvent("spinny:langchange", { detail: { lang: lang } }));
    }

    buttons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        setLang(btn.dataset.lang);
      });
    });

    var initial = "ja";
    try {
      var saved = localStorage.getItem("spinny-lang");
      if (saved === "en" || saved === "ja") initial = saved;
      else if ((navigator.language || "").toLowerCase().indexOf("ja") !== 0) initial = "en";
    } catch (e) {}
    setLang(initial);

    function showToast(key) {
      var lang = document.documentElement.lang === "en" ? "en" : "ja";
      toastEl.textContent = dict[lang][key];
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        toastEl.classList.remove("show");
      }, 1600);
    }

    document.getElementById("discord-copy").addEventListener("click", function () {
      var text = "spinnyhat";
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          function () { showToast("toastCopied"); },
          function () { showToast("toastFailed"); }
        );
      } else {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand("copy");
          showToast("toastCopied");
        } catch (e) {
          showToast("toastFailed");
        }
        document.body.removeChild(ta);
      }
    });
  })();
</script>

    var notes = [];
    var popups = []; // floating judgment text: {x, y, text, color, life}
    var laneFlashes = []; // per-press feedback bar: {lane, life, empty}
    var lastSpawn = 0;
    var combo = 0;
    var playing = false;
    var idleTimer = null;

    // --- key bindings: load, persist, rebind ---
    var keys = DEFAULT_KEYS.slice();
    var keyMap = {};
    var listeningLane = null;

    function buildKeyMap() {
      keyMap = {};
      keys.forEach(function (k, i) {
        keyMap[k] = i;
      });
    }

    function loadKeys() {
      try {
        var saved = JSON.parse(localStorage.getItem("spinny-keys") || "null");
        if (
          Array.isArray(saved) &&
          saved.length === LANES &&
          saved.every(function (k) { return typeof k === "string" && k.length === 1; })
        ) {
          keys = saved;
        }
      } catch (e) {}
      buildKeyMap();
    }

    function saveKeys() {
      try {
        localStorage.setItem("spinny-keys", JSON.stringify(keys));
      } catch (e) {}
    }

    var keyHintEl = document.getElementById("key-hint");
    function updateKeyHint() {
      var s = STR[currentLang()];
      var sep = currentLang() === "ja" ? "・" : " ";
      var keyStr = keys.map(function (k) { return k.toUpperCase(); }).join(sep);
      keyHintEl.textContent = keyStr + " " + s.hintSuffix;
    }

    var localToastTimer = null;
    function showLocalToast(text) {
      var t = document.getElementById("toast");
      t.textContent = text;
      t.classList.add("show");
      clearTimeout(localToastTimer);
      localToastTimer = setTimeout(function () {
        t.classList.remove("show");
      }, 1600);
    }

    var overlay = document.getElementById("settings-overlay");
    var openBtn = document.getElementById("settings-open");
    var closeBtn = document.getElementById("settings-close");
    var resetBtn = document.getElementById("settings-reset");
    var rowsEl = document.getElementById("key-rows");

    function renderKeyRows() {
      var s = STR[currentLang()];
      rowsEl.innerHTML = "";
      keys.forEach(function (k, i) {
        var row = document.createElement("div");
        row.className = "key-row";

        var label = document.createElement("span");
        label.className = "key-row-label";
        label.textContent = s.lane + " " + (i + 1);

        var badge = document.createElement("button");
        badge.type = "button";
        badge.className = "key-badge" + (listeningLane === i ? " listening" : "");
        badge.textContent = listeningLane === i ? s.listening : k.toUpperCase();
        badge.addEventListener("click", function () {
          listeningLane = listeningLane === i ? null : i;
          renderKeyRows();
        });

        row.appendChild(label);
        row.appendChild(badge);
        rowsEl.appendChild(row);
      });
    }

    function openSettings() {
      listeningLane = null;
      renderKeyRows();
      overlay.classList.add("open");
    }
    function closeSettings() {
      listeningLane = null;
      overlay.classList.remove("open");
    }

    openBtn.addEventListener("click", openSettings);
    closeBtn.addEventListener("click", closeSettings);
    overlay.addEventListener("click", function (e) {
      if (e.target === overlay) closeSettings();
    });
    resetBtn.addEventListener("click", function () {
      keys = DEFAULT_KEYS.slice();
      buildKeyMap();
      saveKeys();
      listeningLane = null;
      renderKeyRows();
      updateKeyHint();
    });

    document.addEventListener("spinny:langchange", function () {
      updateKeyHint();
      if (overlay.classList.contains("open")) renderKeyRows();
    });

    loadKeys();
    updateKeyHint();

    function ink() {
      return getComputedStyle(document.documentElement).getPropertyValue("--ink").trim() || "#eef1f7";
    }
    function accent() {
      return getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#4deeea";
    }
    function accent2() {
      return getComputedStyle(document.documentElement).getPropertyValue("--accent-2").trim() || "#ff3d81";
    }

    function resize() {
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      laneWidth = Math.min(120, w / (LANES * 2.2));
      hitY = h * 0.88;
    }
    window.addEventListener("resize", resize);
    resize();

    function laneX(i) {
      var totalWidth = LANES * laneWidth * 1.9;
      var start = (w - totalWidth) / 2 + laneWidth * 0.95;
      return start + i * laneWidth * 1.9;
    }

    function drawStatic() {
      ctx.clearRect(0, 0, w, h);
      ctx.strokeStyle = ink();
      ctx.globalAlpha = 0.08;
      ctx.lineWidth = 1;
      for (var i = 0; i < LANES; i++) {
        var x = laneX(i);
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();
      }
      ctx.globalAlpha = 0.16;
      ctx.beginPath();
      ctx.moveTo(0, hitY);
      ctx.lineTo(w, hitY);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    if (reduceMotion) {
      drawStatic();
      return;
    }

    function enterPlaying() {
      if (!playing) {
        playing = true;
        document.body.classList.add("playing");
      }
      clearTimeout(idleTimer);
      idleTimer = setTimeout(function () {
        playing = false;
        combo = 0;
        document.body.classList.remove("playing");
      }, 2200);
    }

    function spawnPopup(x, y, text, color) {
      popups.push({ x: x, y: y, text: text, color: color, life: 1 });
    }

    function judge(laneIndex) {
      var now = performance.now();
      var best = null;
      var bestDiff = Infinity;
      for (var i = 0; i < notes.length; i++) {
        var n = notes[i];
        if (n.lane !== laneIndex) continue;
        var absDiff = Math.abs(now - n.hitTime);
        if (absDiff < bestDiff && absDiff <= JUDGE_MS) {
          bestDiff = absDiff;
          best = n;
        }
      }
      var x = laneX(laneIndex);
      if (!best) {
        laneFlashes.push({ lane: laneIndex, life: 1, empty: true });
        return;
      }
      notes.splice(notes.indexOf(best), 1);
      combo++;
      if (bestDiff <= PERFECT_MS) {
        spawnPopup(x, hitY, "PERFECT", accent());
      } else {
        spawnPopup(x, hitY, "GREAT", accent2());
      }
      laneFlashes.push({ lane: laneIndex, life: 1, empty: false });
    }

    window.addEventListener("keydown", function (e) {
      var key = (e.key || "").toLowerCase();

      // Rebinding a lane in the settings panel takes priority over gameplay.
      if (listeningLane !== null) {
        if (key === "escape") {
          listeningLane = null;
          renderKeyRows();
          return;
        }
        if (key.length !== 1) return; // ignore Shift/Tab/Arrow keys etc.
        var dupIndex = keys.indexOf(key);
        if (dupIndex !== -1 && dupIndex !== listeningLane) {
          showLocalToast(STR[currentLang()].duplicate);
          return;
        }
        keys[listeningLane] = key;
        buildKeyMap();
        saveKeys();
        listeningLane = null;
        renderKeyRows();
        updateKeyHint();
        return;
      }

      if (overlay.classList.contains("open")) {
        if (key === "escape") closeSettings();
        return; // panel open, gameplay paused otherwise
      }
      if (e.repeat) return;
      if (!(key in keyMap)) return;
      enterPlaying();
      judge(keyMap[key]);
    });

    function spawnNote(now) {
      var lane = Math.floor(Math.random() * LANES);
      var travel = 1400 + Math.random() * 500; // ms
      notes.push({ lane: lane, spawnTime: now, travelMs: travel, hitTime: now + travel });
    }

    function drawComboHud(inkColor) {
      if (!playing) return;
      ctx.save();
      ctx.textAlign = "center";
      ctx.lineJoin = "round";

      ctx.font = "700 12px " + MONO_STACK;
      ctx.lineWidth = 3;
      ctx.strokeStyle = inkColor;
      ctx.fillStyle = inkColor;
      ctx.strokeText("COMBO", w / 2, h * 0.14);
      ctx.fillText("COMBO", w / 2, h * 0.14);

      ctx.font = "900 46px " + MONO_STACK;
      ctx.lineWidth = 5;
      ctx.strokeStyle = inkColor;
      ctx.fillStyle = accent();
      ctx.strokeText(String(combo), w / 2, h * 0.14 + 44);
      ctx.fillText(String(combo), w / 2, h * 0.14 + 44);
      ctx.restore();
    }

    function step(t) {
      if (t - lastSpawn > 460) {
        if (Math.random() < 0.7) spawnNote(t);
        lastSpawn = t;
      }

      var inkColor = ink();
      ctx.clearRect(0, 0, w, h);

      ctx.strokeStyle = inkColor;
      ctx.globalAlpha = 0.06;
      ctx.lineWidth = 1;
      for (var i = 0; i < LANES; i++) {
        var lx = laneX(i);
        ctx.beginPath();
        ctx.moveTo(lx, 0);
        ctx.lineTo(lx, h);
        ctx.stroke();
      }
      ctx.globalAlpha = 0.14;
      ctx.beginPath();
      ctx.moveTo(0, hitY);
      ctx.lineTo(w, hitY);
      ctx.stroke();
      ctx.globalAlpha = 1;

      for (var n = notes.length - 1; n >= 0; n--) {
        var note = notes[n];

        if (t - note.hitTime > JUDGE_MS) {
          if (combo > 0) combo = 0;
          spawnPopup(laneX(note.lane), hitY, "MISS", inkColor);
          notes.splice(n, 1);
          continue;
        }

        var progress = (t - note.spawnTime) / note.travelMs;
        var ny = -20 + progress * (hitY + 20);
        var nx = laneX(note.lane);

        ctx.fillStyle = accent();
        ctx.strokeStyle = inkColor;
        ctx.lineWidth = 2;
        ctx.fillRect(nx - laneWidth * 0.4, ny - 6, laneWidth * 0.8, 12);
        ctx.strokeRect(nx - laneWidth * 0.4, ny - 6, laneWidth * 0.8, 12);
      }

      for (var f = laneFlashes.length - 1; f >= 0; f--) {
        var lf = laneFlashes[f];
        lf.life -= 0.09;
        if (lf.life <= 0) {
          laneFlashes.splice(f, 1);
          continue;
        }
        var fx = laneX(lf.lane);
        ctx.fillStyle = lf.empty ? inkColor : accent();
        ctx.globalAlpha = lf.life * (lf.empty ? 0.25 : 0.5);
        ctx.fillRect(fx - laneWidth * 0.45, hitY - 18, laneWidth * 0.9, 36);
        ctx.globalAlpha = 1;
      }

      for (var p = popups.length - 1; p >= 0; p--) {
        var pop = popups[p];
        pop.life -= 0.018;
        if (pop.life <= 0) {
          popups.splice(p, 1);
          continue;
        }
        pop.y -= 0.6;
        ctx.save();
        ctx.textAlign = "center";
        ctx.font = "900 16px " + MONO_STACK;
        ctx.lineWidth = 4;
        ctx.lineJoin = "round";
        ctx.globalAlpha = Math.min(1, pop.life * 1.4);
        ctx.strokeStyle = inkColor;
        ctx.strokeText(pop.text, pop.x, pop.y);
        ctx.fillStyle = pop.color;
        ctx.fillText(pop.text, pop.x, pop.y);
        ctx.restore();
        ctx.globalAlpha = 1;
      }

      drawComboHud(inkColor);

      requestAnimationFrame(step);
    }

    requestAnimationFrame(step);
  })();
</script>
