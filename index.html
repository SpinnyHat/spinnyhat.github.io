<title>spinny — profile</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #0a0b10;
    --bg-deep: #050509;
    --panel: rgba(18, 20, 30, 0.72);
    --panel-border: rgba(77, 238, 234, 0.22);
    --ink: #eef1f7;
    --ink-dim: #8a90a6;
    --accent: #4deeea;
    --accent-soft: rgba(77, 238, 234, 0.16);
    --accent-2: #ff3d81;
    --line: rgba(238, 241, 247, 0.1);
    --font-display: ui-monospace, "Cascadia Code", "SFMono-Regular", "Consolas", "Liberation Mono", monospace;
    --font-body: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Hiragino Sans",
      "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 6vh 1.25rem;
    position: relative;
    overflow-x: hidden;
    background:
      radial-gradient(ellipse 60% 45% at 50% 8%, rgba(77, 238, 234, 0.08), transparent 60%),
      radial-gradient(ellipse 70% 50% at 85% 95%, rgba(255, 61, 129, 0.06), transparent 60%),
      var(--bg-deep);
  }

  canvas#lanes {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 0;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 26rem;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: clamp(1.5rem, 5vw, 2.25rem);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, 0.3),
      0 20px 60px -20px rgba(0, 0, 0, 0.7),
      0 0 40px -12px var(--accent-soft);
  }

  .lang-toggle {
    position: absolute;
    top: clamp(1rem, 3vw, 1.4rem);
    right: clamp(1rem, 3vw, 1.4rem);
    display: flex;
    border: 1px solid var(--line);
    border-radius: 999px;
    overflow: hidden;
    font-family: var(--font-display);
    font-size: 0.7rem;
    letter-spacing: 0.06em;
  }

  .lang-toggle button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink-dim);
    padding: 0.32rem 0.65rem;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .lang-toggle button[aria-pressed="true"] {
    background: var(--accent-soft);
    color: var(--accent);
  }

  .lang-toggle button:focus-visible,
  .link-note:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .title-plate {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    margin-bottom: 1.1rem;
  }

  .eyebrow {
    font-family: var(--font-display);
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .handle {
    margin: 0;
    font-size: clamp(1.7rem, 6vw, 2.15rem);
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.05;
    text-wrap: balance;
  }

  .bio {
    margin: 0 0 1.3rem;
    color: var(--ink-dim);
    font-size: 0.98rem;
    line-height: 1.6;
  }

  .judgment-line {
    height: 1px;
    margin: 0 0 1.3rem;
    background: linear-gradient(
      90deg,
      transparent,
      var(--accent) 15%,
      var(--accent) 85%,
      transparent
    );
    opacity: 0.5;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
  }

  .link-note {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    width: 100%;
    padding: 0.7rem 0.85rem;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid var(--line);
    border-radius: 9px;
    color: var(--ink);
    text-decoration: none;
    font-family: var(--font-body);
    text-align: left;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }

  .link-note:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .link-note:active {
    transform: scale(0.99);
  }

  .note-icon {
    flex: none;
    width: 1.15rem;
    height: 1.15rem;
    color: var(--accent);
  }
  .note-icon svg { width: 100%; height: 100%; display: block; fill: currentColor; }

  .note-label {
    display: flex;
    flex-direction: column;
    gap: 0.05rem;
    min-width: 0;
  }

  .note-kind {
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  .note-handle {
    font-family: var(--font-display);
    font-size: 0.92rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .copy-hint {
    margin-left: auto;
    flex: none;
    font-family: var(--font-display);
    font-size: 0.65rem;
    color: var(--ink-dim);
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .link-note:hover .copy-hint,
  .link-note:focus-visible .copy-hint {
    opacity: 1;
  }

  footer {
    margin-top: 1.4rem;
    text-align: center;
    font-family: var(--font-display);
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    color: var(--ink-dim);
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 2rem;
    transform: translate(-50%, 0.5rem);
    z-index: 2;
    background: var(--panel);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: var(--font-display);
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    padding: 0.55rem 1rem;
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
</style>

  <footer data-i18n="footer">— GG —</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  (function () {
    var dict = {
      ja: {
        eyebrow: "プレイヤー",
        bio: "ただの音ゲーマー",
        xLabel: "X (Twitter)",
        discordLabel: "Discord",
        copyHint: "コピー",
        toastCopied: "コピーしました",
        toastFailed: "コピーできませんでした"
      },
      en: {
        eyebrow: "PLAYER",
        bio: "Just a rhythm gamer",
        xLabel: "X (Twitter)",
        discordLabel: "Discord",
        copyHint: "COPY",
        toastCopied: "Copied",
        toastFailed: "Couldn't copy"
      }
    };

    var buttons = document.querySelectorAll(".lang-toggle button");
    var toastEl = document.getElementById("toast");
    var toastTimer = null;

    function setLang(lang) {
      var d = dict[lang] || dict.ja;
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        var key = el.getAttribute("data-i18n");
        if (d[key] != null) el.textContent = d[key];
      });
      buttons.forEach(function (btn) {
        btn.setAttribute("aria-pressed", String(btn.dataset.lang === lang));
      });
      try {
        localStorage.setItem("spinny-lang", lang);
      } catch (e) {}
    }

    buttons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        setLang(btn.dataset.lang);
      });
    });

    var initial = "ja";
    try {
      var saved = localStorage.getItem("spinny-lang");
      if (saved === "en" || saved === "ja") initial = saved;
      else if ((navigator.language || "").toLowerCase().indexOf("ja") !== 0) initial = "en";
    } catch (e) {}
    setLang(initial);

    function showToast(key) {
      var lang = document.documentElement.lang === "en" ? "en" : "ja";
      toastEl.textContent = dict[lang][key];
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        toastEl.classList.remove("show");
      }, 1600);
    }

    document.getElementById("discord-copy").addEventListener("click", function () {
      var text = "spinnyhat";
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          function () { showToast("toastCopied"); },
          function () { showToast("toastFailed"); }
        );
      } else {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand("copy");
          showToast("toastCopied");
        } catch (e) {
          showToast("toastFailed");
        }
        document.body.removeChild(ta);
      }
    });
  })();
</script>

<script>
  (function () {
    var canvas = document.getElementById("lanes");
    var ctx = canvas.getContext("2d");
    var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w, h, laneCount, laneWidth, hitY;
    var notes = [];
    var flashes = [];
    var lastSpawn = 0;

    function resize() {
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      laneCount = w < 640 ? 3 : 5;
      laneWidth = Math.min(120, w / (laneCount * 2.2));
      hitY = h * 0.86;
    }
    window.addEventListener("resize", resize);
    resize();

    function laneX(i) {
      var totalWidth = laneCount * laneWidth * 1.9;
      var start = (w - totalWidth) / 2 + laneWidth * 0.95;
      return start + i * laneWidth * 1.9;
    }

    function drawStatic() {
      ctx.clearRect(0, 0, w, h);
      ctx.strokeStyle = "rgba(77, 238, 234, 0.08)";
      ctx.lineWidth = 1;
      for (var i = 0; i < laneCount; i++) {
        var x = laneX(i);
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();
      }
      ctx.strokeStyle = "rgba(77, 238, 234, 0.18)";
      ctx.beginPath();
      ctx.moveTo(0, hitY);
      ctx.lineTo(w, hitY);
      ctx.stroke();
    }

    if (reduceMotion) {
      drawStatic();
      return;
    }

    function spawnNote(t) {
      var lane = Math.floor(Math.random() * laneCount);
      notes.push({
        lane: lane,
        y: -20,
        speed: 2.6 + Math.random() * 1.8,
        hit: false
      });
    }

    function step(t) {
      if (t - lastSpawn > 420) {
        if (Math.random() < 0.7) spawnNote(t);
        lastSpawn = t;
      }

      ctx.clearRect(0, 0, w, h);

      ctx.strokeStyle = "rgba(77, 238, 234, 0.06)";
      ctx.lineWidth = 1;
      for (var i = 0; i < laneCount; i++) {
        var x = laneX(i);
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();
      }

      ctx.strokeStyle = "rgba(77, 238, 234, 0.16)";
      ctx.beginPath();
      ctx.moveTo(0, hitY);
      ctx.lineTo(w, hitY);
      ctx.stroke();

      for (var n = notes.length - 1; n >= 0; n--) {
        var note = notes[n];
        note.y += note.speed;
        var x = laneX(note.lane);

        ctx.fillStyle = "rgba(77, 238, 234, 0.85)";
        ctx.shadowColor = "rgba(77, 238, 234, 0.65)";
        ctx.shadowBlur = 10;
        ctx.fillRect(x - laneWidth * 0.42, note.y - 5, laneWidth * 0.84, 10);
        ctx.shadowBlur = 0;

        if (!note.hit && note.y >= hitY) {
          note.hit = true;
          flashes.push({
            x: x,
            y: hitY,
            life: 1,
            color: Math.random() < 0.15 ? "255, 61, 129" : "77, 238, 234"
          });
        }
        if (note.y > h + 30) notes.splice(n, 1);
      }

      for (var f = flashes.length - 1; f >= 0; f--) {
        var fl = flashes[f];
        fl.life -= 0.045;
        if (fl.life <= 0) {
          flashes.splice(f, 1);
          continue;
        }
        var r = (1 - fl.life) * 34 + 6;
        ctx.beginPath();
        ctx.arc(fl.x, fl.y, r, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(" + fl.color + ", " + fl.life * 0.6 + ")";
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      requestAnimationFrame(step);
    }

    requestAnimationFrame(step);
  })();
</script>
